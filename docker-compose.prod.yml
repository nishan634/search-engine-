# Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Adds a TLS-terminating reverse proxy. App ports stay bound to 127.0.0.1 in the base file.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  db:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  backend:
    restart: unless-stopped
    environment:
      SECURE_COOKIES: "1"
      DJANGO_DEBUG: "0"
  worker:
    restart: unless-stopped
  frontend:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
