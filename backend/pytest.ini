[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py
env =
    USE_SQLITE=1
    CELERY_EAGER=1
    DJANGO_DEBUG=0
    THROTTLE_AUTH=1000/min
    THROTTLE_AI=1000/min
    THROTTLE_SEARCH=1000/min
    THROTTLE_UPLOAD=1000/min
    THROTTLE_USER=100000/min
    THROTTLE_ANON=100000/min
    OPENAI_API_KEY=
    BRAVE_API_KEY=
    TAVILY_API_KEY=
